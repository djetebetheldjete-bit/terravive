name: macro_plastique_balmer
description: "Macro Plastique Balmer — information, alertes et mobilisation citoyenne contre les déchets plastiques du littoral."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_map: ^7.0.2       # cartes OpenStreetMap (équivalent Leaflet)
  latlong2: ^0.9.1
  fl_chart: ^0.69.2         # graphiques statistiques
  intl: ^0.19.0
  # Notifications push (à activer après `flutterfire configure`) :
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
