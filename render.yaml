# Configuration de déploiement pour Render (https://render.com)
# Render lit ce fichier et configure le service. Renseignez les clés
# marquées « sync: false » dans le tableau de bord (jamais dans le code).
services:
  - type: web
    name: terravive
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # votre clé Claude
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ADMIN_EMAILS
        sync: false            # e-mail(s) administrateur
      - key: SUPABASE_URL
        sync: false            # facultatif
      - key: SUPABASE_KEY
        sync: false            # facultatif
      - key: ISDA_USERNAME
        sync: false            # facultatif : compte iSDAsoil (cartes de sol 30 m)
      - key: ISDA_PASSWORD
        sync: false            # facultatif
      - key: VERTEA_URL
        sync: false            # adresse du moteur satellite Vertea (service ci-dessous)
      - key: VERTEA_TOKEN
        sync: false            # jeton partagé avec Vertea (même valeur des deux côtés)

  # Vertea — moteur satellite (Google Earth Engine), dossier vertea/ de ce dépôt.
  # Appelé uniquement par le serveur Terravive (/api/sat/*), jamais directement par le navigateur.
  - type: web
    name: vertea
    runtime: docker
    plan: free
    rootDir: vertea
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEE_KEY_JSON
        sync: false            # contenu de la clé du compte de service Earth Engine
      - key: GEE_PROJECT
        sync: false            # projet Google Cloud de Earth Engine
      - key: VERTEA_TOKEN
        sync: false            # même valeur que côté Terravive
