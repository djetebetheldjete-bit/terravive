# Lance les tests automatiques à chaque modification du dépôt.
# Résultat visible dans l'onglet « Actions » de GitHub (coche verte ou croix rouge).
name: Tests automatiques

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lancer les tests
        run: npm test
